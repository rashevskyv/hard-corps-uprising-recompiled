# ReXGlue runtime settings, read from <exe dir>/hard_corps_uprising.toml.
# The launcher writes the player's choices to <user data>/settings.toml, which is loaded after this file.
# Full (purchased) license for XamContentGetLicenseMask; the SDK default 0 means trial.
license_mask = 1
gpu_plugin = "xenos"

# Keyboard emulates the Xbox 360 pad next to a connected controller, with ReXGlue's default bindings.
mnk_mode = true
# Empty skips the optional gamecontrollerdb.txt load; SDL's built-in mappings still apply.
hid_mappings_file = ""

# Default game window: 853x480 logical, centered on the primary display. Logical pixels are scaled by the display scale.
fullscreen = false
monitor = 1
window_width = 853
window_height = 480
# Guest video mode for 16:9 Original. The launcher's Aspect Ratio sets it for the other formats when the game starts.
# Independent of the window size; ReXGlue would take it from the window size otherwise.
video_mode_width = 853
video_mode_height = 480
